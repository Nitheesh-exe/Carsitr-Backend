server.port=8080

# Spring DataSource (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/nash_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# SQL initialization (seed script)
spring.sql.init.mode=always
spring.sql.init.continue-on-error=true

# JWT Configuration (Nash Security)
nash.jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
nash.jwt.expiration-ms=86400000

# Logging
logging.level.com.nash.carrental=DEBUG
logging.level.org.springframework.security=INFO
